name: agentic-coffee
services:
  db:
    image: postgres:17-bookworm@sha256:3645570cccdfa447589da9f57dd740faa29b30938e861289a5574b6ca6b03826
    environment:
      POSTGRES_DB: coffee
      POSTGRES_USER: coffee
      POSTGRES_PASSWORD: ${COFFEE_DB_PASSWORD:?Run python3 app/docker/init_env.py first}
    volumes:
      - coffee_db:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U coffee -d coffee']
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: app/Dockerfile
    ports:
      - '127.0.0.1:${COFFEE_PORT:-8088}:8088'
    environment:
      BIND_HOST: 0.0.0.0
      PORT: '8088'
      COFFEE_DATABASE_URL: postgresql://coffee:${COFFEE_DB_PASSWORD:?Run init_env.py}@db:5432/coffee
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost:8088,127.0.0.1:8088}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      COFFEE_STAFF_TOKEN: ${COFFEE_STAFF_TOKEN:-}
      AI_MODE: ${AI_MODE:-demo}
      COFFEE_DEBUG_UI: ${COFFEE_DEBUG_UI:-false}
      AI_PROVIDER: ${AI_PROVIDER:-gemini}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-google/gemini-3.1-flash-lite}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.1-flash-lite}
      LIGHTRAG_URL: ${LIGHTRAG_URL:-http://lightrag:9621}
      LIGHTRAG_API_KEY: ${LIGHTRAG_API_KEY:?Run init_env.py}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: [CMD, python, -c, 'import urllib.request; urllib.request.urlopen("http://127.0.0.1:8088/health", timeout=3)']
      interval: 10s
      timeout: 4s
      retries: 6
      start_period: 10s
    init: true
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    restart: unless-stopped

  lightrag: &lightrag_service
    # Optional while UI uses demo data; enabled with --profile ai.
    profiles: [ai]
    image: ghcr.io/hkuds/lightrag@sha256:5bdbd524931b011df246fe20888d110cef691e6804c12cde636a2b746d7de27e
    environment: &lightrag_environment
      HOST: 0.0.0.0
      PORT: '9621'
      WORKING_DIR: /app/data/rag_storage
      INPUT_DIR: /app/data/inputs
      PROMPT_DIR: /app/data/prompts
      LIGHTRAG_API_KEY: ${LIGHTRAG_API_KEY:?Run init_env.py}
      WHITELIST_PATHS: /health
      LLM_BINDING: gemini
      LLM_BINDING_HOST: http://gemini-gateway:8089
      LLM_BINDING_API_KEY: ${GEMINI_API_KEY:-}
      LLM_MODEL: ${GEMINI_MODEL:-gemini-3.1-flash-lite}
      # Serial extraction reduces bursts on Gemini's per-minute free-tier quota.
      MAX_ASYNC_LLM: ${LIGHTRAG_MAX_ASYNC_LLM:-1}
      EXTRACT_MAX_ASYNC_LLM: ${LIGHTRAG_MAX_ASYNC_LLM:-1}
      MAX_PARALLEL_INSERT: '1'
      LLM_TIMEOUT: '240'
      EMBEDDING_BINDING: gemini
      EMBEDDING_BINDING_HOST: http://gemini-gateway:8089
      EMBEDDING_BINDING_API_KEY: ${GEMINI_API_KEY:-}
      EMBEDDING_MODEL: gemini-embedding-001
      EMBEDDING_DIM: '1536'
      EMBEDDING_SEND_DIM: 'true'
      EMBEDDING_TOKEN_LIMIT: '2048'
      EMBEDDING_FUNC_MAX_ASYNC: '1'
      EMBEDDING_BATCH_NUM: '10'
      EMBEDDING_TIMEOUT: '90'
    depends_on:
      gemini-gateway:
        condition: service_healthy
    volumes:
      - coffee_rag:/app/data
    healthcheck:
      test: [CMD, python, -c, 'import urllib.request; urllib.request.urlopen("http://127.0.0.1:9621/health", timeout=5)']
      interval: 15s
      timeout: 6s
      retries: 12
      start_period: 60s
    restart: unless-stopped

  lightrag-openrouter:
    # Dedicated index: do not mix new embedding transport with legacy vectors.
    <<: *lightrag_service
    profiles: [openrouter]
    environment:
      <<: *lightrag_environment
      LLM_BINDING: openai
      LLM_BINDING_HOST: https://openrouter.ai/api/v1
      LLM_BINDING_API_KEY: ${OPENROUTER_API_KEY:-}
      LLM_MODEL: ${OPENROUTER_MODEL:-google/gemini-3.1-flash-lite}
      EMBEDDING_BINDING: openai
      EMBEDDING_BINDING_HOST: https://openrouter.ai/api/v1
      EMBEDDING_BINDING_API_KEY: ${OPENROUTER_API_KEY:-}
      EMBEDDING_MODEL: google/gemini-embedding-001
      EMBEDDING_DIM: '1536'
      EMBEDDING_SEND_DIM: 'true'
    depends_on: {}
    volumes:
      - coffee_rag_openrouter:/app/data

  gemini-gateway:
    # Internal only: pace LightRAG calls within conservative free-tier budgets.
    profiles: [ai]
    build:
      context: .
      dockerfile: app/docker/Dockerfile.gemini-gateway
    environment:
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    healthcheck:
      test: [CMD, python, -c, 'import urllib.request; urllib.request.urlopen("http://127.0.0.1:8089/health", timeout=3)']
      interval: 10s
      timeout: 4s
      retries: 6
    init: true
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    restart: unless-stopped

volumes:
  coffee_db:
  coffee_rag:
  coffee_rag_openrouter:
